services:
  app:
    build:
      context: .
      dockerfile: dev.Dockerfile
    container_name: ${APP_NAME:-saque-pix}-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./vendor:/var/www/vendor
      - runtime-data:/var/www/runtime
    ports:
      - "${SERVER_PORT:-9502}:${SERVER_PORT:-9502}"
    environment:
      - APP_NAME=${APP_NAME:-saque-pix}
      - APP_ENV=prod
      - TZ=America/Sao_Paulo
      - DB_DRIVER=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=saque_pix
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - DB_CHARSET=utf8mb4
      - SERVER_PORT=${SERVER_PORT:-9502}
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: ${APP_NAME:-saque-pix}-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=saque_pix
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3306}:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${APP_NAME:-saque-pix}-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - app-network

volumes:
  mysql-data:
  runtime-data:

networks:
  app-network:
    name: ${APP_NAME:-saque-pix}-network
    driver: bridge
